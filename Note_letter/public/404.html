<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Opening SendTheLetter…</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f0e8;color:#344a3c;font-family:system-ui,sans-serif}main{text-align:center;padding:2rem}a{color:inherit}</style>
</head>
<body>
<main><h1>SendTheLetter</h1><p>Opening your writing space…</p><a href="/">Back to home</a></main>
<script>
(function() {
  var path = window.location.pathname;
  // Render static sites may return 404 when a React route is loaded directly.
  // Redirect only known in-app paths to the safe root bootstrap.
  if (/^\/(?:dashboard(?:\/.*)?|login|signup|about|services|contact|creator|admin)$/.test(path)) {
    var destination = path + window.location.search + window.location.hash;
    window.location.replace('/?route=' + encodeURIComponent(destination));
  }
})();
</script>
</body>
</html>
