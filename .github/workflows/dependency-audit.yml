name: Dependency security audit

# Dependency updates are reviewable pull requests, never unattended writes to main.
on:
  push:
    branches: [main]
    paths:
      - 'Note_letter/package.json'
      - 'Note_letter/package-lock.json'
      - 'Note_letter/server/package.json'
      - 'Note_letter/server/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'Note_letter/package.json'
      - 'Note_letter/package-lock.json'
      - 'Note_letter/server/package.json'
      - 'Note_letter/server/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app == 'frontend' && 'Note_letter/package-lock.json' || 'Note_letter/server/package-lock.json' }}
      - name: Install exactly locked dependencies
        working-directory: ${{ matrix.app == 'frontend' && 'Note_letter' || 'Note_letter/server' }}
        run: npm ci
      - name: Capture npm security advisories
        working-directory: ${{ matrix.app == 'frontend' && 'Note_letter' || 'Note_letter/server' }}
        run: npm audit --json > audit-report.json || true
      - name: Summarize dependency risk
        working-directory: ${{ matrix.app == 'frontend' && 'Note_letter' || 'Note_letter/server' }}
        run: |
          node -e "const r=require('./audit-report.json'); const v=r.metadata?.vulnerabilities||{}; console.log(JSON.stringify({totals:v, advisories:Object.entries(r.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable,via:x.via.map(y=>typeof y==='string'?y:{title:y.title,url:y.url,range:y.range})}))},null,2))" | tee audit-summary.json
          echo '### Dependency audit: ${{ matrix.app }}' >> "$GITHUB_STEP_SUMMARY"
          cat audit-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-npm-audit
          path: ${{ matrix.app == 'frontend' && 'Note_letter' || 'Note_letter/server' }}/audit-report.json
          retention-days: 14
      - name: Block high and critical vulnerabilities
        working-directory: ${{ matrix.app == 'frontend' && 'Note_letter' || 'Note_letter/server' }}
        run: |
          node -e "const r=require('./audit-report.json');const v=r.metadata?.vulnerabilities||{};const count=(v.high||0)+(v.critical||0);if(count){console.error('Found '+count+' high/critical dependency advisories. Review and update dependencies in a PR.');process.exit(1)}console.log('No high or critical dependency advisories.');"
