name: Frontend quality checks

on:
  pull_request:
    paths:
      - "Note_letter/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - "redesign/**"
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Install, type-check, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Note_letter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Note_letter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Type-check TypeScript
        run: npx tsc -b
      - name: Build production frontend
        run: npm run build
      - name: Verify public build version stamp
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const build = JSON.parse(readFileSync('dist/build-version.json', 'utf8'));
          assert.equal(build.commit, process.env.GITHUB_SHA?.toLowerCase());
          NODE

  backend:
    name: Backend type-check and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Note_letter/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Note_letter/server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Type-check backend
        run: npm run build
