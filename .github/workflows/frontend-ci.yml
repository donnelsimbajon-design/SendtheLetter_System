name: Frontend quality checks

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - "redesign/**"
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    name: Install, type-check, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Note_letter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Note_letter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible dependency security fixes
        if: github.event_name == 'pull_request'
        run: npm audit fix || true
      - name: Commit dependency security fixes to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: patch vulnerable frontend dependencies"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Type-check TypeScript
        run: npx tsc -b
      - name: Build production frontend
        run: npm run build
