name: Frontend quality checks

on:
  pull_request:
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - "redesign/**"
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    name: Install, type-check, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Note_letter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Note_letter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Type-check TypeScript
        run: npx tsc -b
      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Note_letter/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Note_letter/server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Build backend TypeScript
        run: npm run build
