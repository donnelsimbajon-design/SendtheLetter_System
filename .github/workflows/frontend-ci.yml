name: Frontend quality checks

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - "redesign/**"
    paths:
      - "Note_letter/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    name: Install, type-check, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Note_letter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: redesign/warm-editorial-product-refresh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Note_letter/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Upgrade Vite and React plugin to patched compatible releases
        run: npm install vite@^6.4.5 @vitejs/plugin-react@^5.1.4 --save-dev
      - name: Commit build-tool security updates to PR branch
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: patch Vite toolchain dependencies"
            git push origin "HEAD:redesign/warm-editorial-product-refresh"
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check TypeScript
        run: npx tsc -b
      - name: Build production frontend
        run: npm run build
